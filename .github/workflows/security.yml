# Security scans before merging to main: run on PR/push to develop and main.
# Fix or acknowledge any reported vulnerabilities before merging develop → main.

name: Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  govulncheck:
    name: Go vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.10.0

      - name: Run govulncheck
        run: govulncheck ./...

  grype:
    name: Grype (container image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: pgwd:scan
          file: ./Dockerfile

      # Pin Grype image tag (Dependabot docker ecosystem can refresh).
      - name: Run Grype on image
        run: |
          docker run --rm --pull=always \
            -v /var/run/docker.sock:/var/run/docker.sock \
            anchore/grype:v0.122.1 \
            pgwd:scan --fail-on high
