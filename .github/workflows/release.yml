# Release: runs on tag push (v*). Publishes binaries and Docker image to ghcr.io.
# Trigger: git tag v0.6.4 && git push origin v0.6.4  (any v* semver tag)
# Requires: release-check passed before tagging (make release-check).
#
# QEMU + Buildx + GHCR login: same pattern as gghstats (.github/workflows/release.yml).
# Without Buildx, dockers_v2 fails on ubuntu-latest: "Multi-platform build is not supported for the docker driver".
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run release checks
        run: make release-check

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GH Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PAT with contents:write on hrodrig/homebrew-pgwd (GITHUB_TOKEN cannot push to another repo).
          # If unset, GoReleaser skips Homebrew cask upload (see .goreleaser.yaml skip_upload).
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
