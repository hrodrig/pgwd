# RBAC for pgwd running OUTSIDE the cluster with kube.password_from_secret (read-only Secret get).
# Apply in the namespace where the Postgres credentials Secret lives.
# Does NOT grant pods/exec — unlike the removed DISCOVER_MY_PASSWORD path.
#
# Adjust secretName to match your Secret. For multiple secrets, duplicate rules or use a Role per Secret.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pgwd-outside
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pgwd-secret-reader
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["postgres-credentials"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pgwd-secret-reader
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pgwd-secret-reader
subjects:
  - kind: ServiceAccount
    name: pgwd-outside
    namespace: default
