# GoReleaser config for pgwd
# https://goreleaser.com
# Release: merge develop → main, git tag v0.1.0, then make release
# Snapshot (no tag): make snapshot

version: 2

before:
  hooks:
    - sh -c 'gzip -c contrib/man/man1/pgwd.1 > contrib/man/man1/pgwd.1.gz'

builds:
  - id: pgwd
    main: ./cmd/pgwd
    binary: pgwd
    goos:
      - linux
      - darwin
      - windows
      - freebsd
      - openbsd
      - netbsd
      - dragonfly
      - solaris
    goarch:
      - amd64
      - arm64
      - riscv64
    # Ignore GOOS/GOARCH combos not supported by Go (e.g. darwin/riscv64, solaris/arm64, solaris/riscv64)
    ignore:
      - goos: darwin
        goarch: riscv64
      - goos: windows
        goarch: riscv64
      - goos: solaris
        goarch: arm64
      - goos: solaris
        goarch: riscv64
      - goos: dragonfly
        goarch: riscv64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.Version=v{{ .Version }}
      - -X main.Commit={{ .ShortCommit }}
      - -X main.BuildDate={{ .Date }}
      - -X main.Branch={{ .Branch }}

archives:
  - id: default
    ids:
      - pgwd
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    # Always {{ .Version }} (from tag on release, or PGWD_SNAPSHOT_VERSION on snapshot) — not {{ .Tag }}.
    # Keep the literal v prefix so FreeBSD/OpenBSD DISTFILES stay pgwd_v<semver>_*.
    name_template: "{{ .ProjectName }}_v{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - src: contrib/man/man1/pgwd.1
        dst: share/man/man1/pgwd.1
      - src: LICENSE
        dst: share/doc/pgwd/LICENSE
      - src: contrib/openbsd/pgwd
        dst: share/openbsd/rc.d/pgwd
      - src: contrib/netbsd/rc.d/pgwd
        dst: share/netbsd/rc.d/pgwd
      - src: contrib/dragonflybsd/rc.d/pgwd
        dst: share/dragonfly/rc.d/pgwd
      - src: contrib/solaris/smf/pgwd
        dst: share/solaris/smf/pgwd
      - src: contrib/solaris/smf/pgwd.xml
        dst: share/solaris/smf/pgwd.xml
      - src: contrib/pgwd.conf.example
        dst: etc/pgwd/pgwd.conf.example

checksum:
  name_template: "checksums.txt"

# Cosign keyless signing (GitHub Actions OIDC). Requires id-token: write in release.yml
# and sigstore/cosign-installer. Signs checksums.txt and container images on ghcr.io.
# Cosign v3+: use --bundle (sigstore JSON); --output-signature/--output-certificate are deprecated.
signs:
  - cmd: cosign
    env:
      - COSIGN_EXPERIMENTAL=1
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - --yes
    artifacts: checksum

# SBOM via syft (GoReleaser invokes syft; install in release.yml).
# Source-tree catalog per release. Container image SBOM attestation deferred (buildx driver limit).
sboms:
  - id: pgwd-sbom-spdx
    artifacts: source
    documents:
      - "pgwd_{{ .Version }}_sbom.spdx.json"
    args: ["$artifact", "--output", "spdx-json=$document"]
  - id: pgwd-sbom-cdx
    artifacts: source
    documents:
      - "pgwd_{{ .Version }}_sbom.cyclonedx.json"
    args: ["$artifact", "--output", "cyclonedx-json=$document"]

nfpms:
  - id: default
    package_name: pgwd
    scripts:
      preremove: contrib/deb/prerm.sh
      postremove: contrib/deb/postrm.sh
    file_name_template: "{{ .ProjectName }}_v{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    description: Postgres Watch Dog - monitor PostgreSQL connections and notify via Slack/Loki
    vendor: "Hermes Rodríguez"
    maintainer: Hermes Rodriguez <hermesrodriguez@users.noreply.github.com>
    homepage: https://github.com/hrodrig/pgwd
    license: MIT
    formats:
      - deb
      - rpm
    ids:
      - pgwd
    contents:
      - src: contrib/man/man1/pgwd.1.gz
        dst: /usr/share/man/man1/
      # Config: install example as /etc/pgwd/pgwd.conf; user must edit (client, db.url, notifications).
      # config|noreplace: on upgrade, do not overwrite if user modified the file.
      - src: contrib/pgwd.conf.example
        dst: /etc/pgwd/pgwd.conf
        type: config|noreplace
      # systemd units: daemon, one-shot, timer. User enables with: systemctl enable --now pgwd
      - src: contrib/systemd/pgwd.service
        dst: /lib/systemd/system/pgwd.service
      - src: contrib/systemd/pgwd-once.service
        dst: /lib/systemd/system/pgwd-once.service
      - src: contrib/systemd/pgwd.timer
        dst: /lib/systemd/system/pgwd.timer

snapshot:
  version_template: "{{ .Env.PGWD_SNAPSHOT_VERSION }}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"

release:
  github:
    owner: hrodrig
    name: pgwd

# Docker: multi-arch image to ghcr.io (same GITHUB_TOKEN). Requires buildx + qemu for local release.
# Snapshot builds skip Docker so `make snapshot` works without a daemon (e.g. FreeBSD dev VMs).
# sbom: false — GitHub Actions uses the default docker buildx driver, which does not support
# --attest=type=sbom (see https://goreleaser.com/customization/dockers_v2/ "Docker manifests vs Docker images").
dockers_v2:
  - disable: "{{ .IsSnapshot }}"
    sbom: false
    dockerfile: Dockerfile.release
    ids:
      - pgwd
    images:
      - ghcr.io/hrodrig/pgwd
    tags:
      - "v{{ .Version }}"
      - "{{ if not .IsSnapshot }}latest{{ end }}"
    labels:
      org.opencontainers.image.title: "pgwd"
      org.opencontainers.image.description: "Postgres Watch Dog - monitor PostgreSQL connections and notify via Slack/Loki"
      org.opencontainers.image.source: "https://github.com/hrodrig/pgwd"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .Date }}"
    # No `annotations:` (OCI index-level): GoReleaser passes `--annotation index:…`; the default
    # GitHub Actions docker buildx driver fails with "index annotations not supported for single platform export".

# Cosign keyless signing for container manifests built by dockers_v2.
docker_signs:
  - cmd: cosign
    env:
      - COSIGN_EXPERIMENTAL=1
    args:
      - sign
      - "${artifact}@${digest}"
      - --yes

# Homebrew: publish cask to https://github.com/hrodrig/homebrew-pgwd (brew install hrodrig/pgwd/pgwd).
# CI: set repo secret HOMEBREW_TAP_TOKEN (PAT with contents:write on the tap repo; GITHUB_TOKEN cannot push there).
homebrew_casks:
  - name: pgwd
    ids:
      - default
    directory: Casks
    homepage: "https://github.com/hrodrig/pgwd"
    description: "Postgres Watch Dog - monitor PostgreSQL connections and notify via Slack/Loki"
    commit_msg_template: "Brew cask update for {{ .ProjectName }} version {{ .Tag }}"
    commit_author:
      name: Hermes Rodríguez
      email: hrodrig@usb.ve
    repository:
      owner: hrodrig
      name: homebrew-pgwd
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    url:
      verified: "github.com/hrodrig/pgwd/"
    manpages:
      - share/man/man1/pgwd.1
    caveats: |
      Sample configuration is not bundled with the Homebrew cask.
      Generate it with `pgwd --print-sample-config > /etc/pgwd/pgwd.conf`.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/pgwd"]
          end
