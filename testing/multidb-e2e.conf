# Config for multi-database E2E (test-integration, test-e2e-kube).
# Points to 3 Postgres: pgwd, analytics, replica.
client: pgwd-e2e-multidb
interval: 0
dry_run: true
databases:
  - url: postgres://pgwd:pgwd@localhost:5432/pgwd?sslmode=disable
    client: pgwd-e2e-multidb-pgwd
  - url: postgres://pgwd:pgwd@localhost:5433/analytics?sslmode=disable
    client: pgwd-e2e-multidb-analytics
  - url: postgres://pgwd:pgwd@localhost:5434/replica?sslmode=disable
    client: pgwd-e2e-multidb-replica
