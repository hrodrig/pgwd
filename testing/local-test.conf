# Local test config: daemon mode with SQLite + HTTP to exercise ncruces/store.
# Requires: docker compose -f testing/compose.yaml up -d --scale client=0
client: pgwd-local-test
interval: 5
dry_run: true
log_level: info    # use debug for verbose stats every interval

databases:
  - url: postgres://pgwd:pgwd@localhost:5432/pgwd?sslmode=disable
  - url: postgres://pgwd:pgwd@localhost:5433/analytics?sslmode=disable
  - url: postgres://pgwd:pgwd@localhost:5434/replica?sslmode=disable

sqlite:
  path: /tmp/pgwd-test.db
  max_metrics: 1000

http:
  listen: ":8080"
  base_path: "/api/pgwd/v1"
  healthz_path: "/healthz"
  metrics_path: "/metrics"
